# Publishes ComfyCrawler to the Comfy Registry (https://registry.comfy.org), which is where
# ComfyUI-Manager finds it. Manual only - run it from the repo's Actions tab. Needs:
#   - the publisher (sorryaboutyourcats) in pyproject.toml [tool.comfy] PublisherId - done
#   - that publisher's API key (named "ComfyCrawler" on the Registry) saved in this repo as the
#     Actions secret REGISTRY_ACCESS_TOKEN - the name this file reads, whatever the key is called
#   - [project] version in pyproject.toml bumped for every release
# (The Registry's own template also publishes on every push that touches pyproject.toml - left out
# on purpose, so a version bump never goes public by accident.)
name: Publish to Comfy registry
on:
  workflow_dispatch:

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'sorryaboutyourcats' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
