[project]
name = "comfycrawler"
description = "A Windows 95 style 3D dungeon crawler generated by your ComfyUI - served at /comfycrawler/ with a button in ComfyUI's menu. Adds no graph nodes."
version = "0.1.0"
license = { file = "LICENSE" }
# Mirrors requirements.txt. Narration (piper-tts) is opt-in - see requirements-narration.txt.
dependencies = ["websocket-client>=1.7", "imageio-ffmpeg>=0.4.9", "pillow>=10.0", "numpy>=1.24"]

[project.urls]
Repository = "https://github.com/sorryaboutyourcats/ComfyCrawler"
#  Used by Comfy Registry https://registry.comfy.org

[tool.comfy]
# The publisher on https://registry.comfy.org - permanent, can't be changed there.
PublisherId = "sorryaboutyourcats"
DisplayName = "ComfyCrawler"
Icon = "https://raw.githubusercontent.com/sorryaboutyourcats/ComfyCrawler/main/favicon.svg"
