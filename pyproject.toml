[project]
name = "comfycrawler"
description = "A Windows 95 style 3D dungeon crawler generated by your ComfyUI - served at /comfycrawler/ with a button in ComfyUI's menu. Adds no graph nodes."
# The Registry wants three parts, so v0.111 is written 0.111.0. Also shown in the About box's title
# bar (index.html) and the ComfyUI sidebar footer (comfyui_web/comfycrawler.js) - bump all three.
version = "0.111.1"
license = { file = "LICENSE" }
# The Registry shows these as supported OS / GPU. Matches what it's tested on (README > Requirements):
# Mac is out until its fp8 checkpoints run on MPS, and Linux is untested.
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Environment :: GPU :: NVIDIA CUDA",
]
# Mirrors requirements.txt. Narration (piper-tts) is opt-in - see requirements-narration.txt.
dependencies = ["websocket-client>=1.7", "av>=13.0", "pillow>=10.0", "numpy>=1.24"]

[project.urls]
Repository = "https://github.com/sorryaboutyourcats/ComfyCrawler"
#  Used by Comfy Registry https://registry.comfy.org

[tool.comfy]
# The publisher on https://registry.comfy.org - permanent, can't be changed there.
PublisherId = "sorryaboutyourcats"
DisplayName = "ComfyCrawler"
# README > Requirements: the oldest ComfyUI it's tested on.
requires-comfyui = ">=0.34.2"
# web/icon.png is favicon.svg's pixel art at 400x400 (the Registry's limit is 800x400). A raw GitHub link only
# loads while the repo is public - a private repo's raw files 404, and the Registry shows a placeholder.
Icon = "https://raw.githubusercontent.com/sorryaboutyourcats/ComfyCrawler/main/web/icon.png"
